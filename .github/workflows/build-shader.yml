name: Build EIVORIS Shader

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/eivoris/**"
      - "src/materials/**"
      - ".github/workflows/build-shader.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/eivoris/**"
      - "src/materials/**"
      - ".github/workflows/build-shader.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EIVORIS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch pinned RenderDragon shader source
        run: |
          git clone https://github.com/devendrn/newb-x-mcbe.git upstream
          git -C upstream checkout 0d4c1536b21ee4a5152dc935fc84aa0aedaec8e6

      - name: Apply EIVORIS configuration and rendering modules
        run: |
          cp src/eivoris/config.h upstream/src/newb/config.h
          cp src/eivoris/pack_config.toml upstream/src/newb/pack_config.toml
          mkdir -p upstream/src/newb/functions
          cp src/eivoris/functions/water.h upstream/src/newb/functions/water.h
          cp src/eivoris/functions/rain.h upstream/src/newb/functions/rain.h

      - name: Improve underwater light transport and caustics
        working-directory: upstream
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/newb/functions/lighting.h")
          source = path.read_text()
          pattern = r"void nlUnderwaterLighting\(.*?\n}\n(?=\nvec3 nlEntityLighting)"
          replacement = """void nlUnderwaterLighting(inout vec3 light, inout vec3 pos, vec2 lit, vec2 uv1, vec3 tiledCpos, vec3 cPos, highp float t, vec3 horizonCol) {
            // Keep the engine's underwater lightmap gate; this is the condition
            // used by the original RenderDragon caustics path.
            if (uv1.y < 0.9) {
              float c0 = disp(tiledCpos, NL_WATER_WAVE_SPEED*t);
              float c1 = disp(tiledCpos*1.71 + vec3(0.37, 0.0, 0.61), NL_WATER_WAVE_SPEED*t*0.81);
              c0 = c0*c0;
              c1 = c1*c1;
              float caustics = 0.66*c0 + 0.34*c1;
              caustics = smoothstep(0.10, 0.76, caustics);
              float lightMask = 0.24 + lit.y + lit.x*0.42;
              light += NL_UNDERWATER_BRIGHTNESS*0.55
                     + NL_CAUSTIC_INTENSITY*caustics*lightMask;
            }

            // Cool underwater scattering without washing out the caustic contrast.
            vec3 scatterColor = mix(normalize(horizonCol), vec3(0.34, 0.64, 0.76), 0.42);
            light *= mix(scatterColor, vec3_splat(0.62), lit.y*0.52);

            #ifdef NL_UNDERWATER_WAVE
              pos.xy += NL_UNDERWATER_WAVE*min(0.05*pos.z,0.6)*sin(t*1.2 + dot(cPos,vec3_splat(PI_HALF)));
            #endif
          }"""
          updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not locate nlUnderwaterLighting() in pinned upstream source")
          path.write_text(updated)
          print("Patched dual-layer underwater caustics and cool scattering")
          PY

      - name: Install build dependencies
        working-directory: upstream
        run: python -m pip install -r requirements.txt

      - name: Prepare shader compiler and material data
        working-directory: upstream
        run: ./build.sh setup

      - name: Compile Android material-bin resource pack
        working-directory: upstream
        run: ./build.sh pack -p android -v 1

      - name: Validate MTBinLoader2 material payload
        working-directory: upstream
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import json
          import os
          import tempfile

          archives = list(Path("build").glob("*.mcpack"))
          if len(archives) != 1:
              raise SystemExit(f"Expected exactly one .mcpack, found {len(archives)}")

          archive = archives[0]
          with ZipFile(archive, "r") as source:
              bad_member = source.testzip()
              if bad_member:
                  raise SystemExit(f"Corrupt ZIP member: {bad_member}")
              names = source.namelist()
              material_bins = [
                  name for name in names
                  if name.startswith("renderer/materials/")
                  and name.endswith(".material.bin")
              ]
              if not material_bins:
                  raise SystemExit(
                      "No renderer/materials/*.material.bin payload found; "
                      "this pack cannot be validated for MTBinLoader2."
                  )
              manifest_name = "manifest.json"
              if manifest_name not in names:
                  raise SystemExit("manifest.json missing from shader pack")
              entries = {name: source.read(name) for name in names}

          manifest = json.loads(entries[manifest_name].decode("utf-8"))
          header = manifest.get("header", {})
          description = header.get("description", "")
          description = description.replace(
              "Only works with MB Loader",
              "Requires MaterialBinLoader2 (MTBinLoader2)"
          )
          header["description"] = description
          manifest["header"] = header
          entries[manifest_name] = json.dumps(
              manifest, ensure_ascii=False, indent=2
          ).encode("utf-8")

          fd, temp_name = tempfile.mkstemp(suffix=".mcpack")
          os.close(fd)
          try:
              with ZipFile(temp_name, "w", ZIP_DEFLATED) as target:
                  for name, data in entries.items():
                      target.writestr(name, data)
              os.replace(temp_name, archive)
          finally:
              if os.path.exists(temp_name):
                  os.unlink(temp_name)

          print(f"Validated {len(material_bins)} RenderDragon material-bin files:")
          for name in material_bins:
              print(f" - {name}")
          final_name = Path("build") / "EIVORIS-Shader-1.1-Android.mcpack"
          archive.rename(final_name)
          print(f"MTBinLoader2-ready resource-pack container: {final_name}")
          PY

      - name: Upload EIVORIS MTBinLoader2 pack
        uses: actions/upload-artifact@v4
        with:
          name: EIVORIS-MTBinLoader2-Android
          path: upstream/build/*.mcpack
          if-no-files-found: error
          retention-days: 30
