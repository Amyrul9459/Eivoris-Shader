name: Build EIVORIS Shader

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - ".github/workflows/build-shader.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EIVORIS source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # This repository is used only for the generic Lazurite/shaderc build
      # wrapper and BGFX include/toolchain. Its shader source is never used.
      - name: Fetch shader compiler toolchain
        run: |
          git clone https://github.com/devendrn/newb-x-mcbe.git toolchain
          git -C toolchain checkout 0d4c1536b21ee4a5152dc935fc84aa0aedaec8e6
          rm -rf toolchain/src/materials toolchain/src/newb
          mkdir -p toolchain/src
          cp -R src/materials toolchain/src/materials
          mkdir -p toolchain/src/newb
          cp src/eivoris/pack_config.toml toolchain/src/newb/pack_config.toml
          cp -R src/eivoris toolchain/src/eivoris
          rm -rf toolchain/assets
          cp -R assets toolchain/assets

      - name: Install compiler dependencies
        working-directory: toolchain
        run: python -m pip install -r requirements.txt

      - name: Prepare shader compiler and vanilla material metadata
        working-directory: toolchain
        run: ./build.sh setup

      - name: Compile EIVORIS RenderChunk material
        working-directory: toolchain
        run: ./build.sh pack -p android

      - name: Validate and name MTBinLoader2 package
        working-directory: toolchain
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import json, os, tempfile

          archives = list(Path("build").glob("*.mcpack"))
          if len(archives) != 1:
              raise SystemExit(f"Expected one mcpack, found {len(archives)}")
          archive = archives[0]

          with ZipFile(archive, "r") as source:
              names = source.namelist()
              bins = [
                  n for n in names
                  if n.startswith("renderer/materials/") and n.endswith(".material.bin")
              ]
              if not bins:
                  raise SystemExit("No compiled RenderDragon material-bin found")
              if "manifest.json" not in names:
                  raise SystemExit("manifest.json missing")
              entries = {n: source.read(n) for n in names}

          manifest = json.loads(entries["manifest.json"].decode("utf-8"))
          manifest["header"]["description"] = (
              "EIVORIS independent RenderDragon water and world lighting. "
              "Requires MaterialBinLoader2 (MTBinLoader2)."
          )
          entries["manifest.json"] = json.dumps(
              manifest, ensure_ascii=False, indent=2
          ).encode("utf-8")

          final_path = Path("build/eivoris-shader.mcpack")
          fd, tmp = tempfile.mkstemp(suffix=".mcpack", dir="build")
          os.close(fd)
          try:
              with ZipFile(tmp, "w", ZIP_DEFLATED) as target:
                  for name, data in entries.items():
                      target.writestr(name, data)
              os.replace(tmp, final_path)
          finally:
              if os.path.exists(tmp):
                  os.unlink(tmp)
          archive.unlink()
          print("Compiled material-bin payload:")
          for name in bins:
              print(" -", name)
          print("Package:", final_path)
          PY

      - name: Upload EIVORIS Shader
        uses: actions/upload-artifact@v4
        with:
          name: eivoris-shader
          path: toolchain/build/eivoris-shader.mcpack
          if-no-files-found: error
          retention-days: 30
