name: Build EIVORIS Shader
on:
  push:
    branches: [main, photon-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EIVORIS
        uses: actions/checkout@v4
      - name: Checkout NEWB X Legacy foundation
        run: |
          git clone --depth 1 https://github.com/devendrn/newb-x-mcbe.git upstream
          git -C upstream rev-parse HEAD
      - name: Apply EIVORIS water and lighting
        run: |
          cp src/eivoris/config.h upstream/src/newb/config.h
          cp src/eivoris/pack_config.toml upstream/src/newb/pack_config.toml
          cp src/eivoris/functions/water.h upstream/src/newb/functions/water.h
          python scripts/apply_bsl_lighting.py
      - name: Install build dependencies
        working-directory: upstream
        run: python -m pip install -r requirements.txt
      - name: Prepare compiler and material data
        working-directory: upstream
        run: ./build.sh setup
      - name: Compile Android shader pack
        working-directory: upstream
        run: ./build.sh pack -p android -v 2
      - name: Validate MTBinLoader2 package
        id: package
        working-directory: upstream
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          import os

          config_lines = Path("src/newb/pack_config.toml").read_text().splitlines()
          version_line = next((line for line in config_lines if line.strip().startswith("version") and "=" in line), None)
          if version_line is None:
              raise SystemExit("Could not read EIVORIS version from pack_config.toml")
          version_value = version_line.split("=", 1)[1].strip().strip("[]")
          version_parts = [part.strip() for part in version_value.split(",") if part.strip()]
          if not version_parts or not all(part.isdigit() for part in version_parts):
              raise SystemExit("Invalid EIVORIS version in pack_config.toml")
          version = ".".join(version_parts)

          packs = list(Path("build").glob("*.mcpack"))
          if len(packs) != 1:
              raise SystemExit(f"Expected one .mcpack, found {len(packs)}")
          pack = packs[0]
          with ZipFile(pack) as archive:
              names = archive.namelist()
              bins = [n for n in names if n.endswith(".material.bin")]
              if not bins:
                  raise SystemExit("No compiled .material.bin files found")
              if "manifest.json" not in names:
                  raise SystemExit("manifest.json missing")
              manifest = json.loads(archive.read("manifest.json"))
              if not manifest.get("header", {}).get("uuid"):
                  raise SystemExit("Pack manifest UUID missing")
              print(f"Validated {len(bins)} compiled material binaries")
              for item in bins:
                  print(" -", item)

          target = Path(f"build/eivoris-shader-v{version}.mcpack")
          if target.exists():
              target.unlink()
          pack.rename(target)
          print("Created", target)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
          PY
      - name: Upload Android MTBinLoader2 pack
        uses: actions/upload-artifact@v4
        with:
          name: eivoris-shader-android-v${{ steps.package.outputs.version }}
          path: upstream/build/eivoris-shader-v*.mcpack
          if-no-files-found: error
          retention-days: 30
